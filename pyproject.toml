[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioagent"
version = "0.1.0"
description = "ECG, PPG and PCG research workflow with tool-using agents"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "numpy>=1.26",
    "scipy>=1.12",
    "wfdb>=4.1,<5",
]

[project.optional-dependencies]
models = ["torch>=2.6", "torchaudio>=2.6"]
annotation = ["matplotlib>=3.8"]

[project.scripts]
cardioagent = "cardioagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
